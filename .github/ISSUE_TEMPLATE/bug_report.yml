name: Fehler melden
description: Reproduzierbaren Fehler in CVE Agent melden
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Tenant-IDs, Kundendaten oder vertraulichen Berichte einfügen.
  - type: input
    id: app-version
    attributes:
      label: App-Version und Build
      description: Diese Angaben stehen links oben im CVE-Agent-Fenster.
      placeholder: "1.15.1 (Build 18)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS-Version und Mac-Modell
      placeholder: "macOS 15.6, MacBook Pro"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Berichtsfenster
        - Menüleisten-App
        - Hintergrundprüfung
        - Installation oder Update
        - Export
        - Datenabruf
        - Einstellungen
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Zusätzliche Informationen
      description: Optional. Nur bereinigte Screenshots oder Fehlermeldungen ohne Geheimnisse und Kundendaten.
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe die Meldung auf Zugangsdaten, Tenant-IDs, Kundendaten und vertrauliche Berichtsinhalte geprüft.
          required: true
        - label: Ich habe nach bestehenden Issues gesucht.
          required: true
